name: Verify repository

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f package.json
          test -f package-lock.json
          test -f contracts/agent-operator-command.schema.json
          node -e "JSON.parse(require('fs').readFileSync('contracts/agent-operator-command.schema.json','utf8')); console.log('PASS — agent/operator contract JSON is valid')"
